name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Unit tests only: protocol codec + AST safety gate. They need no Natron.
    # Contract tests spawn real Natron hosts and run locally (see tests/).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install server package
        run: pip install -e ./server pytest
      - name: run unit tests
        run: pytest tests/test_protocol.py tests/test_gate.py -v
